<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司資訊登記</title>
    <!-- 載入 LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input { display: block; width: 100%; margin-bottom: 10px; padding: 8px; }
        button { width: 100%; padding: 10px; background-color: #06c755; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h3>資料填寫</h3>
    <input type="text" id="company" placeholder="請輸入公司名稱">
    <input type="text" id="name" placeholder="請輸入您的姓名">
    <button id="submitBtn">送出資料</button>

    <script>
        const LIFF_ID = "2010133760-DSVYFTeE";
        const WEBHOOK_URL = "https://phenomenalistic-jennette-unreleasible.ngrok-free.dev/webhook/line-UID-catcher";

        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                }
            } catch (err) {
                console.error("LIFF 初始化失敗", err);
            }
        }

        document.getElementById('submitBtn').addEventListener('click', async () => {
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            // 取得使用者資訊
            const profile = await liff.getProfile();
            
            const payload = {
                uid: profile.userId,
                company: document.getElementById('company').value,
                name: document.getElementById('name').value
            };

            // 發送資料至 n8n
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    alert("資料已成功送出！");
                    liff.closeWindow(); // 成功後關閉視窗
                }
            } catch (error) {
                console.error("發送失敗", error);
                alert("發送失敗，請稍後再試。");
            }
        });

        initLiff();
    </script>
</body>
</html>
